name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            id: win
            target: ""
            arch: x64
            bundle: src-tauri/target/release/bundle
          # Apple Silicon 原生构建。
          - os: macos-latest
            id: mac-arm64
            target: ""
            arch: arm64
            bundle: src-tauri/target/release/bundle
          # GitHub 使用 Apple Silicon runner 交叉构建 Intel 版本。
          - os: macos-latest
            id: mac-x86_64
            target: x86_64-apple-darwin
            arch: x86_64
            bundle: src-tauri/target/x86_64-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      # secrets 不能直接用于 if，先映射到 job 级环境变量。
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release version
        run: node scripts/check-release.mjs "${{ github.ref_name }}"

      - name: Verify project
        run: |
          npm run build
          node scripts/prepare-bundled-plugins.mjs
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      # Windows 代码签名：配置证书 secrets 后自动启用。
      - name: Prepare Windows code signing
        if: matrix.id == 'win' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\office-toolbox-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          "WINDOWS_CERT_PATH=$certPath" >> $env:GITHUB_ENV
          "WINDOWS_CERT_PASSWORD=$env:WINDOWS_CERT_PASSWORD" >> $env:GITHUB_ENV

          $confPath = 'src-tauri/tauri.conf.json'
          $json = Get-Content $confPath -Raw | ConvertFrom-Json
          $sign = [pscustomobject]@{
            cmd  = 'pwsh'
            args = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/sign-windows.ps1', '%1')
          }
          if ($json.bundle.PSObject.Properties['windows']) {
            $json.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $sign -Force
          } else {
            $json.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{ signCommand = $sign })
          }
          $json | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding utf8

      # updater 私钥与 Windows 代码签名证书不同；缺少它无法生成可信的更新包。
      - name: Verify updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: echo '缺少 TAURI_SIGNING_PRIVATE_KEY，无法发布应用内更新。' && exit 1

      - name: Build release
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build ${{ matrix.target != '' && format('-- --target {0}', matrix.target) || '' }}

      # Release 资产统一使用 ASCII 文件名，签名文件必须同步改名。
      - name: Prepare Windows release assets
        if: matrix.id == 'win'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | ForEach-Object {
            Rename-Item $_.FullName "office-toolbox_${ver}_x64-setup.exe"
          }
          Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe.sig' | ForEach-Object {
            Rename-Item $_.FullName "office-toolbox_${ver}_x64-setup.exe.sig"
          }
          Copy-Item 'src-tauri/target/release/office-toolbox.exe' "src-tauri/target/release/office-toolbox_${ver}_x64_portable.exe"

      - name: Prepare macOS release assets
        if: startsWith(matrix.id, 'mac')
        shell: bash
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          bundle="${{ matrix.bundle }}"
          arch="${{ matrix.arch }}"
          found=0
          for file in "$bundle"/dmg/*.dmg; do
            [ -e "$file" ] || continue
            mv "$file" "$bundle/dmg/office-toolbox_${ver}_${arch}.dmg"
            found=1
          done
          [ "$found" -eq 1 ] || { echo '未找到 macOS DMG 产物'; exit 1; }
          mv "$bundle/macos/"*.app.tar.gz "$bundle/macos/office-toolbox_${ver}_${arch}.app.tar.gz"
          mv "$bundle/macos/"*.app.tar.gz.sig "$bundle/macos/office-toolbox_${ver}_${arch}.app.tar.gz.sig"

      - name: Generate Windows update fragment
        if: matrix.id == 'win'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v',''
          node scripts/update-manifest.mjs fragment --tag "${{ github.ref_name }}" --platform windows-x86_64 --repository "${{ github.repository }}" --asset "src-tauri/target/release/bundle/nsis/office-toolbox_${ver}_x64-setup.exe" --output latest-win.json

      - name: Generate macOS update fragment
        if: startsWith(matrix.id, 'mac')
        shell: bash
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.arch }}"
          case "$arch" in
            arm64) platform="darwin-aarch64" ;;
            x86_64) platform="darwin-x86_64" ;;
            *) echo "未知架构：$arch"; exit 1 ;;
          esac
          node scripts/update-manifest.mjs fragment --tag "$GITHUB_REF_NAME" --platform "$platform" --repository "${{ github.repository }}" --asset "${{ matrix.bundle }}/macos/office-toolbox_${ver}_${arch}.app.tar.gz" --output "latest-${{ matrix.id }}.json"

      - name: Generate Windows checksums
        if: matrix.id == 'win'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem 'src-tauri/target/release/bundle/nsis/office-toolbox_*_x64-setup.exe' -ErrorAction Stop
          $files += Get-ChildItem 'src-tauri/target/release/office-toolbox_*_x64_portable.exe' -ErrorAction Stop
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content 'sha256sums-windows.txt' -Encoding ascii
          $files | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm MD5).Hash.ToLower())  $($_.Name)"
          } | Set-Content 'md5sums-windows.txt' -Encoding ascii
          Get-Content 'sha256sums-windows.txt'

      - name: Generate macOS checksums
        if: startsWith(matrix.id, 'mac')
        shell: bash
        run: |
          set -e
          bundle="${{ matrix.bundle }}"
          arch="${{ matrix.arch }}"
          ver="${GITHUB_REF_NAME#v}"
          : > "sha256sums-macos-${arch}.txt"
          : > "md5sums-macos-${arch}.txt"
          for file in "$bundle/dmg/office-toolbox_${ver}_${arch}.dmg" "$bundle/macos/office-toolbox_${ver}_${arch}.app.tar.gz"; do
            (cd "$(dirname "$file")" && shasum -a 256 "$(basename "$file")") >> "sha256sums-macos-${arch}.txt"
            (cd "$(dirname "$file")" && md5 -r "$(basename "$file")") >> "md5sums-macos-${arch}.txt"
          done
          cat "sha256sums-macos-${arch}.txt"

      - name: Upload update fragment
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest-${{ matrix.id }}
          path: latest-${{ matrix.id }}.json

      - name: Create Windows release
        if: matrix.id == 'win'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "办公工具箱 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/office-toolbox_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/office-toolbox_*_x64-setup.exe.sig
            src-tauri/target/release/office-toolbox_*_x64_portable.exe
            sha256sums-windows.txt
            md5sums-windows.txt

      - name: Create macOS release
        if: startsWith(matrix.id, 'mac')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "办公工具箱 ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            ${{ matrix.bundle }}/dmg/office-toolbox_*_${{ matrix.arch }}.dmg
            ${{ matrix.bundle }}/macos/office-toolbox_*_${{ matrix.arch }}.app.tar.gz
            ${{ matrix.bundle }}/macos/office-toolbox_*_${{ matrix.arch }}.app.tar.gz.sig
            sha256sums-macos-${{ matrix.arch }}.txt
            md5sums-macos-${{ matrix.arch }}.txt

  latest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download update fragments
        uses: actions/download-artifact@v4
        with:
          pattern: update-manifest-*
          path: update-manifest
          merge-multiple: true

      - name: Merge latest manifest
        run: node scripts/update-manifest.mjs merge --output latest.json update-manifest/latest-win.json update-manifest/latest-mac-arm64.json update-manifest/latest-mac-x86_64.json

      - name: Upload latest manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
